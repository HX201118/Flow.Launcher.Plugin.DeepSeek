name: Build windows plugin package

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Publish
      run: dotnet publish Flow.Launcher.Plugin.DeepSeek/Flow.Launcher.Plugin.DeepSeek.csproj -c Release -r win-x64 --no-self-contained

    - name: Package
      shell: pwsh
      run: Compress-Archive -LiteralPath "Flow.Launcher.Plugin.DeepSeek/bin/Release/win-x64/publish" -DestinationPath "Flow.Launcher.Plugin.DeepSeek.zip" -Force

    - name: Upload build artifact
      uses: actions/upload-artifact@v4
      with:
        name: Flow.Launcher.Plugin.DeepSeek
        path: Flow.Launcher.Plugin.DeepSeek.zip

    - name: Create GitHub release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: Flow.Launcher.Plugin.DeepSeek.zip
        overwrite_files: true
